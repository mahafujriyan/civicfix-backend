services:
  redis:
    image: redis:7-alpine
    container_name: civicfix-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - civicfix_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  civicfix_redis_data:
